name: CI

on:
  push:
    branches: [master]
    # OTA 触发源：推送 v 开头 tag（如 v1.2.3）时跑下方 release-ota job。
    # 注意：tag 必须指向包含本 ci.yml 的提交，否则跑的是旧配置；tag 名必须以 v 开头。
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# 手动反复调流水线时，同一分支/PR 的新一次运行会取消仍在跑的旧运行，省排队时间。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build firmware (esp32s3)
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v4

      - name: Cache IDF incremental build
        uses: actions/cache@v4
        with:
          path: build
          key: idf-build-esp32s3-${{ hashFiles('sdkconfig.defaults', 'dependencies.lock', '**/CMakeLists.txt', '**/idf_component.yml') }}
          restore-keys: |
            idf-build-esp32s3-

      # 组件管理器的下载产物缓存：同一份 dependencies.lock 只在首次跑时联网拉取。
      # 路径在 gitignore 内（managed_components/），不上库；放这里纯为加速与离线稳定。
      - name: Cache managed components
        uses: actions/cache@v4
        with:
          path: managed_components
          key: managed-components-${{ hashFiles('dependencies.lock') }}
          restore-keys: |
            managed-components-

      # 镜像通常已把 IDF_PATH 指向 /opt/esp/idf；此处兜底再显式 export。
      - name: Build
        run: |
          export IDF_PATH="${IDF_PATH:-/opt/esp/idf}"
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build

      # 产物为可烧录文件（烧录用 flash/download 页能直接按 flasher_args 取）。
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: |
            build/firmware.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
          if-no-files-found: error
          retention-days: 14

# ===========================================================================
# OTA 发布 job（已启用）
#
# 触发：仅当推送 v 开头 tag（refs/tags/v*）时运行；
#   master 提交 / PR / 手动触发（ref=分支）时此 job 会显示 skipped —— 这是设计行为，不是故障。
#   ✓ git tag v1.2.3 && git push origin v1.2.3
#   ✓ 想验证不写代码提交：tag 先推一次，之后 gh workflow run ci.yml --ref v1.2.3
#   ✗ 手动 Run workflow 选 master 分支 → OTA 必跳过（请把 ref 选成 tag）
#   ✗ tag 名不是 v 开头（如 1.2.3）→ 不触发
#   ✗ tag 指向的提交早于本配置 → Actions 会执行旧版 ci.yml，看不到此 job
#
# 语义：
#   - 分区表 two_ota_large（16MB 双 OTA 槽），idf.py build 产出的 build/firmware.bin
#     就是可下发 OTA 的 app 镜像，无需二次加工；
#   - 在 tag 时刻的代码上独立重编一次，产物挂到该 tag 的 GitHub Release：
#     release/<tag>/firmware-ota-esp32s3-vX.Y.Z.bin
#   - 若平台 OTA 需要的是普通构建产物而非 GitHub Release，把 Attach 步骤换成
#     actions/upload-artifact 即可，二者择一。
#
# 权限：job 级已声明 contents: write（softprops 往 Release 写资产），
#   无需仓库 Settings -> Actions -> General 的全局读写开关。
# ===========================================================================

  release-ota:
    name: Build OTA app image for ${{ github.ref_name }}
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    container: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v4
  
      # 与 ci build job 同款增量缓存（tag 发版频率低，直接复用 build/ 缓存加速）。
      - name: Cache IDF incremental build
        uses: actions/cache@v4
        with:
          path: build
          key: idf-build-esp32s3-${{ hashFiles('sdkconfig.defaults', 'dependencies.lock', '**/CMakeLists.txt', '**/idf_component.yml') }}
          restore-keys: |
            idf-build-esp32s3-
  
      - name: Build
        run: |
          export IDF_PATH="${IDF_PATH:-/opt/esp/idf}"
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
  
      # 重命名为带版本的 OTA 负载（Release 资产名）。
      - name: Rename OTA image
        run: |
          cp build/firmware.bin build/firmware-ota-esp32s3-${{ github.ref_name }}.bin
  
      # 挂到 tag 对应的 GitHub Release（不存在 Release 时会自动创建）。
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/firmware-ota-esp32s3-${{ github.ref_name }}.bin

# ---------------------------------------------------------------------------
# 不用提交代码的本地试跑方式（可选）
#
# A. act（完整模拟本 workflow，含解析 yaml，需要 Docker）：
#      docker --version                 # 先确认 Docker 已装
#      act -W .github/workflows/ci.yml  # 在仓库根目录执行
#
# B. 只验证编译（不装 Docker，用本机 IDF，与 CI 逻辑等价）：
#      . <你的 idf export.sh>           # 例如 . ~/.espressif/master/esp-idf/export.sh
#      idf.py set-target esp32s3 && idf.py build
#
# C. 推到 GitHub 后手动触发（无需新提交）：
#      gh workflow run ci.yml --ref master
#      gh run watch
# ---------------------------------------------------------------------------
